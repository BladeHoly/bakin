<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakin</title>
  <script type="importmap">{"imports":{"@glass-midas/core":"./vendor/glass-midas/core/index.js"}}</script>
  <link rel="stylesheet" href="vendor/glass-midas/components/styles.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="mini.css">
  <script type="module" src="mini.js"></script>
</head>
<body data-layout="bar">
  <!-- «Modo mínimo» (0.24): a bar or the cover as a card. Drag it by any empty spot or the cover;
       double click or Esc: back to the full window; the wheel: volume; ⋯: the rest. -->
  <main class="mini" data-tauri-drag-region>
    <div class="m-cover" id="m-cover" data-tauri-drag-region title="Doble clic: volver a la ventana completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-tauri-drag-region><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="m-meta" data-tauri-drag-region>
      <strong id="m-title" data-tauri-drag-region>Nada sonando</strong>
      <div class="m-sub" data-tauri-drag-region><small id="m-artist" data-tauri-drag-region></small><span class="m-time" id="m-time" data-tauri-drag-region></span></div>
      <div class="m-seek" id="m-seek" title="Ir a ese momento"><i id="m-fill"></i></div>
      <span class="m-volnote" id="m-volnote" aria-live="polite" hidden></span>
    </div>
    <div class="m-buttons">
      <button class="gm-chip gm-chip-plain gm-chip-round" id="m-prev" aria-label="Atrasar; clic derecho: tema anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8zM5 19V5"/></svg></button>
      <button class="gm-chip gm-chip-round m-play" id="m-play" title="Reproducir o pausar (Espacio)" aria-label="Reproducir">
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg></button>
      <button class="gm-chip gm-chip-plain gm-chip-round" id="m-next" aria-label="Adelantar; clic derecho: tema siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8zM19 5v14"/></svg></button>
    </div>
    <div class="m-window">
      <button class="gm-chip gm-chip-plain gm-chip-round" id="m-expand" title="Volver a la ventana completa (Esc)" aria-label="Volver a la ventana completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
      <button class="gm-chip gm-chip-plain gm-chip-round m-more" id="m-more" aria-expanded="false" title="Más opciones" aria-label="Más opciones">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
    <div class="m-grip" id="m-grip" title="Arrastrar para cambiar el tamaño" aria-hidden="true"></div>
  </main>
  <!-- ⋯: in room the window makes for it (down, or up near the screen's bottom edge) -->
  <div class="m-pop" id="m-pop" hidden>
    <div class="m-menu" id="m-menu" role="menu" aria-label="Opciones">
      <button role="menuitemcheckbox" id="mm-top" aria-checked="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M5 17h14l-2-4V5H7v8z"/></svg><span>Siempre encima</span><i class="mm-check" aria-hidden="true">✓</i></button>
      <button role="menuitem" id="mm-layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg><span>Ver como tarjeta</span></button>
      <button role="menuitem" id="mm-gaming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l6.5 17 2.4-7.1L20 10.5z"/></svg><span>Modo gaming</span></button>
      <hr>
      <button role="menuitem" id="mm-tray"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg><span>Cerrar y seguir en la bandeja</span></button>
    </div>
    <div class="m-ask" id="m-ask" hidden>
      <p><strong>Modo gaming</strong> Los clics van a pasar a lo que está detrás. Para volver: Ctrl+Shift+G o el ícono de Bakin en la bandeja.</p>
      <div class="m-ask-actions"><button class="gm-chip gm-chip-plain" id="m-ask-no">Cancelar</button><button class="gm-chip gm-chip-primary" id="m-ask-yes">Activar</button></div>
    </div>
  </div>
</body>
</html>
